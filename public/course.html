<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𝐄ᴅᴜ-𝐋ᴇᴀᴋ - Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--surface3:#22222e;--border:#2a2a3a;--text:#e8e8f0;--text-dim:#8888a0;--text-muted:#555570;--purple:#6c5ce7;--purple-dim:#5a4bd6;--teal:#00cec9;--teal-dim:#00b5b0;--red:#ff4757;--orange:#ffa502;--green:#2ed573;--glass:rgba(18,18,26,0.8);--glass-border:rgba(108,92,231,0.15);--radius:12px;--radius-sm:8px;--radius-xs:6px;--shadow:0 8px 32px rgba(0,0,0,0.4);--shadow-sm:0 4px 16px rgba(0,0,0,0.3);--transition:all 0.3s cubic-bezier(0.4,0,0.2,1)}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6}
h1,h2,h3,h4,h5,h6{font-family:'Space Grotesk',sans-serif;font-weight:600}
a{text-decoration:none;color:inherit}
button{font-family:'Inter',sans-serif;cursor:pointer;border:none;outline:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--purple)}

#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal));z-index:10000;transition:width 0.3s ease;width:0}

.hero{position:relative;min-height:420px;display:flex;align-items:flex-end;padding:40px 0 32px;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,rgba(108,92,231,0.15),rgba(0,206,201,0.08),transparent);z-index:0}
.hero-bg::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 30h60M30 0v60' stroke='%23ffffff' stroke-width='.3' opacity='.04'/%3E%3C/svg%3E");opacity:0.5}
.hero-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.3}
.hero-orb-1{width:400px;height:400px;background:var(--purple);top:-100px;right:-100px}
.hero-orb-2{width:300px;height:300px;background:var(--teal);bottom:-80px;left:-60px;opacity:0.15}
.hero-poster{position:absolute;inset:0;z-index:0}
.hero-poster img{width:100%;height:100%;object-fit:cover;opacity:0.35}
.hero-poster-fade{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 5%,rgba(0,0,0,0.55) 60%,rgba(0,0,0,0.3))}
.hero-thumb{display:block;width:220px;max-width:60%;border-radius:14px;margin-bottom:16px;box-shadow:0 18px 40px rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.08)}
.hero-content{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 24px;width:100%}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;background:rgba(108,92,231,0.15);border:1px solid rgba(108,92,231,0.3);border-radius:20px;font-size:12px;font-weight:500;color:var(--purple);margin-bottom:16px;backdrop-filter:blur(10px)}
.hero-badge img{height:20px;width:auto;border-radius:5px;vertical-align:middle}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--purple);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.hero-title{font-size:clamp(28px,5vw,42px);font-weight:700;line-height:1.2;margin-bottom:12px;background:linear-gradient(135deg,#fff 30%,var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-meta{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:20px}
.hero-meta-item{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text-dim)}
.hero-meta-item svg{width:16px;height:16px;opacity:0.7}
.hero-desc{font-size:15px;color:var(--text-dim);max-width:700px;line-height:1.7;margin-bottom:24px}
.hero-progress{max-width:400px}
.hero-progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:6px}
.hero-progress-bar{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.hero-progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--teal));border-radius:2px;transition:width 0.5s ease}

.tabs-container{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);margin-bottom:0}
.tabs-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;gap:0}
.tab-btn{padding:16px 24px;font-size:14px;font-weight:500;color:var(--text-muted);background:none;border-bottom:2px solid transparent;transition:var(--transition);position:relative}
.tab-btn:hover{color:var(--text-dim)}
.tab-btn.active{color:var(--purple);border-bottom-color:var(--purple)}
.tab-btn .badge{position:absolute;top:10px;right:6px;background:var(--purple);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600}

.main{max-width:1200px;margin:0 auto;padding:24px}
.tab-content{display:none;animation:fadeUp 0.3s ease}
.tab-content.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;transition:var(--transition)}
.stat-card:hover{border-color:rgba(108,92,231,0.3);transform:translateY(-2px)}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:18px}
.stat-icon.purple{background:rgba(108,92,231,0.15);color:var(--purple)}
.stat-icon.teal{background:rgba(0,206,201,0.15);color:var(--teal)}
.stat-icon.orange{background:rgba(255,165,2,0.15);color:var(--orange)}
.stat-icon.green{background:rgba(46,213,115,0.15);color:var(--green)}
.stat-value{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-bottom:4px}
.stat-label{font-size:13px;color:var(--text-muted)}

.section-title{font-size:18px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:3px;height:18px;background:linear-gradient(var(--purple),var(--teal));border-radius:2px}

.content-list{display:flex;flex-direction:column;gap:8px}
.content-item{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition)}
.content-item:hover{border-color:var(--purple);background:var(--surface2);transform:translateX(4px)}
.content-item.completed{border-left:3px solid var(--green)}
.content-item.current{border-left:3px solid var(--purple);background:rgba(108,92,231,0.05)}
.content-icon{width:40px;height:40px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.content-icon.folder{background:rgba(108,92,231,0.12);color:var(--purple)}
.content-icon.video{background:rgba(0,206,201,0.12);color:var(--teal)}
.content-icon.pdf{background:rgba(255,165,2,0.12);color:var(--orange)}
.content-icon.test{background:rgba(255,71,87,0.12);color:var(--red)}
.content-info{flex:1;min-width:0}
.content-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content-sub{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:8px;margin-top:2px}
.content-action{flex-shrink:0;font-size:12px;color:var(--text-muted)}
.content-item .arrow{color:var(--text-muted);flex-shrink:0;transition:var(--transition)}
.content-item:hover .arrow{color:var(--purple);transform:translateX(3px)}

.breadcrumb{display:flex;align-items:center;gap:8px;padding:16px 0;font-size:13px;color:var(--text-muted);flex-wrap:wrap}
.breadcrumb a{color:var(--text-dim);transition:var(--transition)}
.breadcrumb a:hover{color:var(--purple)}
.breadcrumb .sep{opacity:0.4}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--surface3);border-top-color:var(--purple);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text-muted);font-size:14px}

.error-state{text-align:center;padding:80px 20px}
.error-icon{font-size:48px;margin-bottom:16px}
.error-msg{color:var(--text-dim);font-size:16px;margin-bottom:20px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;transition:var(--transition)}
.btn-primary{background:var(--purple);color:#fff}
.btn-primary:hover{background:var(--purple-dim);transform:translateY(-1px)}
.btn-outline{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--purple);color:var(--purple)}

/* ============ TEST UI ============ */
.test-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:none;flex-direction:column;animation:fadeIn 0.3s ease}
.test-overlay.active{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.test-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;gap:12px;flex-wrap:wrap}
.test-header-left{display:flex;align-items:center;gap:12px}
.test-header-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600}
.test-timer{display:flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.2);border-radius:var(--radius-xs);font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--red)}
.test-timer.warning{animation:timerBlink 1s infinite}
@keyframes timerBlink{0%,100%{opacity:1}50%{opacity:0.5}}
.test-header-right{display:flex;align-items:center;gap:10px}
.btn-submit-test{padding:8px 20px;background:var(--red);color:#fff;border-radius:var(--radius-xs);font-size:13px;font-weight:600;transition:var(--transition)}
.btn-submit-test:hover{opacity:0.9;transform:translateY(-1px)}

.test-body{display:flex;flex:1;overflow:hidden}
.test-sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.test-sidebar-header{padding:14px 16px;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border)}
.test-nav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:14px 12px}
.test-nav-btn{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-xs);font-size:12px;font-weight:600;background:var(--surface2);color:var(--text-dim);border:1px solid var(--border);transition:var(--transition);cursor:pointer}
.test-nav-btn:hover{border-color:var(--purple)}
.test-nav-btn.current{background:var(--purple);color:#fff;border-color:var(--purple)}
.test-nav-btn.answered{background:rgba(0,206,201,0.15);color:var(--teal);border-color:var(--teal)}
.test-nav-btn.review{background:rgba(255,165,2,0.15);color:var(--orange);border-color:var(--orange)}
.test-nav-btn.review::after{content:'';position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--orange)}
.test-nav-btn{position:relative}

.test-legend{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.test-legend-item{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-muted)}
.legend-dot{width:10px;height:10px;border-radius:3px;border:1px solid var(--border)}
.legend-dot.current{background:var(--purple);border-color:var(--purple)}
.legend-dot.answered{background:var(--teal);border-color:var(--teal)}
.legend-dot.review{background:var(--orange);border-color:var(--orange)}
.legend-dot.not-visited{background:var(--surface2)}

.test-question-area{flex:1;overflow-y:auto;padding:24px 32px;display:flex;flex-direction:column}
.test-q-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.test-q-number{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:var(--purple)}
.test-q-actions{display:flex;gap:8px}
.btn-mark-review{padding:6px 14px;border-radius:var(--radius-xs);font-size:12px;font-weight:500;background:rgba(255,165,2,0.1);color:var(--orange);border:1px solid rgba(255,165,2,0.2);transition:var(--transition)}
.btn-mark-review:hover{background:rgba(255,165,2,0.2)}
.btn-mark-review.active{background:var(--orange);color:#fff}
.btn-clear{padding:6px 14px;border-radius:var(--radius-xs);font-size:12px;font-weight:500;background:var(--surface2);color:var(--text-dim);border:1px solid var(--border);transition:var(--transition)}
.btn-clear:hover{border-color:var(--text-muted)}

.test-question-text{font-size:16px;line-height:1.8;margin-bottom:24px;color:var(--text)}
.test-question-text img{max-width:100%;border-radius:var(--radius-sm);margin:12px 0}

.test-options{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.test-option{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition)}
.test-option:hover{border-color:var(--purple);background:var(--surface2)}
.test-option.selected{border-color:var(--purple);background:rgba(108,92,231,0.1)}
.option-letter{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;background:var(--surface3);color:var(--text-dim);flex-shrink:0;transition:var(--transition)}
.test-option.selected .option-letter{background:var(--purple);color:#fff}
.option-text{font-size:14px;line-height:1.6;padding-top:4px}
.option-text img{max-width:100%;border-radius:var(--radius-xs);margin:4px 0}

.test-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;gap:12px;flex-wrap:wrap}
.btn-prev,.btn-next{padding:10px 24px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:var(--transition)}
.btn-prev{background:var(--surface2);color:var(--text-dim);border:1px solid var(--border)}
.btn-prev:hover{border-color:var(--purple)}
.btn-next{background:var(--purple);color:#fff}
.btn-next:hover{background:var(--purple-dim)}
.btn-save-next{background:var(--teal);color:#fff;padding:10px 24px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:var(--transition)}
.btn-save-next:hover{opacity:0.9}

.test-mobile-toggle{display:none;position:fixed;bottom:20px;right:20px;z-index:10001;width:48px;height:48px;border-radius:50%;background:var(--purple);color:#fff;font-size:20px;box-shadow:var(--shadow);align-items:center;justify-content:center}
.test-sidebar.mobile-open{display:flex;position:fixed;top:60px;left:0;bottom:0;z-index:10000;width:280px;box-shadow:var(--shadow)}

.test-instructions{padding:32px;max-width:700px;margin:0 auto;overflow-y:auto}
.test-instructions h2{margin-bottom:16px}
.test-instructions p,.test-instructions li{color:var(--text-dim);font-size:14px;line-height:1.8}
.test-instructions ul{padding-left:20px;margin:12px 0}
.test-instructions .inst-meta{display:flex;gap:20px;margin:20px 0;padding:16px;background:var(--surface2);border-radius:var(--radius-sm);flex-wrap:wrap}
.test-instructions .inst-meta-item{display:flex;flex-direction:column;gap:2px}
.test-instructions .inst-meta-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
.test-instructions .inst-meta-value{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;color:var(--teal)}
.btn-start-test{margin-top:24px;padding:14px 32px;background:linear-gradient(135deg,var(--purple),var(--teal));color:#fff;font-size:15px;font-weight:600;border-radius:var(--radius-sm);transition:var(--transition)}
.btn-start-test:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(108,92,231,0.3)}

.submit-modal{position:fixed;inset:0;z-index:10002;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.submit-modal.active{display:flex}
.submit-modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;max-width:420px;width:100%;text-align:center}
.submit-modal-box h3{margin-bottom:12px}
.submit-modal-box p{color:var(--text-dim);font-size:14px;margin-bottom:20px;line-height:1.6}
.submit-stats{display:flex;gap:16px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.submit-stat{text-align:center;padding:10px 16px;background:var(--surface2);border-radius:var(--radius-sm)}
.submit-stat-val{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700}
.submit-stat-val.green{color:var(--green)}
.submit-stat-val.red{color:var(--red)}
.submit-stat-val.orange{color:var(--orange)}
.submit-stat-lbl{font-size:11px;color:var(--text-muted);margin-top:2px}
.submit-modal-actions{display:flex;gap:10px;justify-content:center}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;z-index:20000;box-shadow:var(--shadow);animation:toastIn 0.3s ease,toastOut 0.3s ease 2.7s forwards}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(20px)}}

.folder-header{margin-bottom:16px}
.folder-header h2{font-size:20px;margin-bottom:4px}
.folder-header p{color:var(--text-dim);font-size:13px}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state-icon{font-size:48px;margin-bottom:12px;opacity:0.5}

@media(max-width:768px){
  .hero{min-height:300px;padding:24px 0}
  .hero-title{font-size:24px}
  .tabs-inner{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab-btn{white-space:nowrap;padding:14px 16px;font-size:13px}
  .overview-grid{grid-template-columns:1fr 1fr}
  .test-sidebar{display:none}
  .test-sidebar.mobile-open{display:flex}
  .test-mobile-toggle{display:flex}
  .test-question-area{padding:16px}
  .test-header{padding:10px 14px}
  .test-footer{padding:10px 14px}
  .submit-modal-box{padding:24px}
  .hero-meta{gap:10px}
}
@media(max-width:480px){
  .overview-grid{grid-template-columns:1fr}
  .test-nav-grid{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>
<div id="progress-bar"></div>

<div class="hero" id="hero">
  <div class="hero-bg">
    <div class="hero-orb hero-orb-1"></div>
    <div class="hero-orb hero-orb-2"></div>
  </div>
  <div class="hero-content" id="hero-content">
    <div class="loading"><div class="spinner"></div><div class="loading-text">Loading course...</div></div>
  </div>
</div>

<div class="tabs-container" id="tabs-container" style="display:none">
  <div class="tabs-inner">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="content">Content <span class="badge" id="content-count"></span></button>
  </div>
</div>

<div class="main" id="main">
  <div class="tab-content active" id="tab-overview"></div>
  <div class="tab-content" id="tab-content"></div>
</div>

<div class="test-overlay" id="test-overlay">
  <div class="test-header">
    <div class="test-header-left">
      <button class="btn-clear" onclick="closeTest()" title="Close test">✕</button>
      <span class="test-header-title" id="test-title">Test</span>
    </div>
    <div class="test-timer" id="test-timer">00:00:00</div>
    <div class="test-header-right">
      <button class="btn-submit-test" onclick="showSubmitModal()">Submit Test</button>
    </div>
  </div>
  <div class="test-body">
    <div class="test-sidebar" id="test-sidebar">
      <div class="test-sidebar-header">Questions</div>
      <div class="test-nav-grid" id="test-nav-grid"></div>
      <div class="test-legend">
        <div class="test-legend-item"><div class="legend-dot current"></div>Current</div>
        <div class="test-legend-item"><div class="legend-dot answered"></div>Answered</div>
        <div class="test-legend-item"><div class="legend-dot review"></div>Marked for Review</div>
        <div class="test-legend-item"><div class="legend-dot not-visited"></div>Not Visited</div>
      </div>
    </div>
    <div class="test-question-area" id="test-question-area"></div>
    <div class="test-footer" id="test-footer">
      <button class="btn-prev" onclick="prevQuestion()">← Previous</button>
      <button class="btn-save-next" onclick="saveAndNext()">Save & Next →</button>
      <button class="btn-next" onclick="nextQuestion()">Next →</button>
    </div>
  </div>
</div>

<button class="test-mobile-toggle" id="test-mobile-toggle" onclick="toggleTestSidebar()">☰</button>

<div class="submit-modal" id="submit-modal">
  <div class="submit-modal-box">
    <h3>Submit Test?</h3>
    <p>Are you sure you want to submit? You won't be able to change your answers after submission.</p>
    <div class="submit-stats" id="submit-stats"></div>
    <div class="submit-modal-actions">
      <button class="btn btn-outline" onclick="closeSubmitModal()">Go Back</button>
      <button class="btn btn-primary" style="background:var(--red)" onclick="submitTest()">Submit</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const courseId = params.get('course_id');
  const folderId = params.get('folder_id');
  const folderTitle = params.get('folder_title');
  let courseData = null;
  let contentData = [];
  let visitedSet = new Set();
  let answeredSet = new Set();
  let reviewSet = new Set();
  let currentQ = 0;
  let testQuestions = [];
  let testAnswers = {};
  let testTimer = null;
  let testSeconds = 0;
  let testDuration = 0;
  let currentTestId = null;
  let currentTestTitle = '';

  if(!courseId){
    document.getElementById('hero-content').innerHTML = '<div class="error-state"><div class="error-icon">⚠️</div><div class="error-msg">No course ID provided.</div><a href="/" class="btn btn-primary">Go Home</a></div>';
    return;
  }

  function setProgress(pct){
    document.getElementById('progress-bar').style.width = pct + '%';
  }

  function showToast(msg, type='success'){
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 3000);
  }

  function renderKatex(el){
    if(typeof renderMathInElement === 'function'){
      renderMathInElement(el, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false
      });
    }
  }

  function getContentIcon(item){
    if(item.type === 'folder') return '<div class="content-icon folder">📁</div>';
    if(item.type === 'test') return '<div class="content-icon test">📝</div>';
    if(item.type === 'file'){
      if(item.data && item.data.file_type == 1) return '<div class="content-icon pdf">📄</div>';
      return '<div class="content-icon video">▶</div>';
    }
    return '<div class="content-icon">📎</div>';
  }

  function formatDuration(sec){
    if(!sec) return '';
    const h = Math.floor(sec/3600);
    const m = Math.floor((sec%3600)/60);
    const s = sec%60;
    if(h > 0) return h + 'h ' + m + 'm';
    if(m > 0) return m + 'm ' + s + 's';
    return s + 's';
  }

  function formatTime(sec){
    const h = String(Math.floor(sec/3600)).padStart(2,'0');
    const m = String(Math.floor((sec%3600)/60)).padStart(2,'0');
    const s = String(sec%60).padStart(2,'0');
    return h+':'+m+':'+s;
  }

  async function apiCall(url){
    setProgress(30);
    try {
      const res = await fetch(url);
      if(!res.ok) throw new Error('Network error');
      const data = await res.json();
      setProgress(80);
      return data;
    } catch(e){
      console.error('API error:', e);
      return null;
    }
  }

  async function loadCourse(){
    setProgress(10);
    const data = await apiCall(MJ_API + '?course_id=' + courseId + '&action=details');
    if(!data || !data.success){
      document.getElementById('hero-content').innerHTML = '<div class="error-state"><div class="error-icon">❌</div><div class="error-msg">Failed to load course details.</div><a href="/" class="btn btn-primary">Go Home</a></div>';
      setProgress(0);
      return;
    }
    courseData = extractCourseInfo(data);
    renderHero();
    setProgress(100);
    setTimeout(()=> setProgress(0), 500);
    loadContent();
  }

  function extractCourseInfo(data){
    let root = data.data || data;
    if(Array.isArray(root)){
      for(const sec of root){
        const blocks = sec && sec.data;
        if(Array.isArray(blocks)){
          for(const b of blocks){
            const ld = b && b.layout_data;
            if(Array.isArray(ld) && ld.length && (ld[0].title || ld[0].thumbnail)) return ld[0];
          }
        }
      }
      return root[0] || {};
    }
    return root;
  }

  function stripHtmlText(html){
    if(!html) return '';
    const d = document.createElement('div');
    d.innerHTML = html;
    d.querySelectorAll('img,table,figure,iframe,style,script').forEach(el=>el.remove());
    return (d.textContent || '').replace(/\s+/g,' ').trim();
  }

  function renderHero(){
    const c = courseData || {};
    document.title = (c.title || c.name || 'Course') + ' - 𝐄ᴅᴜ-𝐋ᴇᴀᴋ';
    const desc = stripHtmlText(c.description || c.short_description || c.about || '');
    const thumb = c.thumbnail || c.image || c.cover || c.banner || '';
    const totalItems = c.total_content || c.total_items || c.total || 0;
    const completedItems = c.completed_content || c.completed_items || c.completed || 0;
    const progressPct = totalItems ? Math.round((completedItems/totalItems)*100) : 0;
    const totalDuration = c.total_duration || c.duration || '';

    let metaHtml = '';
    if(totalItems) metaHtml += '<div class="hero-meta-item">📚 ' + totalItems + ' items</div>';
    if(totalDuration) metaHtml += '<div class="hero-meta-item">⏱ ' + totalDuration + '</div>';
    if(c.instructor || c.teacher) metaHtml += '<div class="hero-meta-item">👤 ' + (c.instructor || c.teacher) + '</div>';
    if(c.language || c.lang) metaHtml += '<div class="hero-meta-item">🌐 ' + (c.language || c.lang) + '</div>';

    let progressHtml = '';
    if(totalItems){
      progressHtml = `
        <div class="hero-progress">
          <div class="hero-progress-label"><span>${completedItems} of ${totalItems} completed</span><span>${progressPct}%</span></div>
          <div class="hero-progress-bar"><div class="hero-progress-fill" style="width:${progressPct}%"></div></div>
        </div>`;
    }

    if(thumb){
      const heroEl = document.getElementById('hero');
      let poster = document.getElementById('hero-poster');
      if(!poster){
        poster = document.createElement('div');
        poster.id = 'hero-poster';
        poster.className = 'hero-poster';
        heroEl.insertBefore(poster, heroEl.firstChild);
      }
      poster.innerHTML = '<img src="' + esc(thumb) + '" alt="' + esc(c.title || 'Course') + '"><div class="hero-poster-fade"></div>';
    }

    document.getElementById('hero-content').innerHTML = `
      <div class="hero-badge"><img src="eduleak-logo.jpg" alt="𝐄ᴅᴜ-𝐋ᴇᴀᴋ"><span class="dot"></span>𝐄ᴅᴜ-𝐋ᴇᴀᴋ</div>
      ${thumb ? '<img class="hero-thumb" src="' + esc(thumb) + '" alt="' + esc(c.title || 'Course') + '">' : ''}
      <h1 class="hero-title">${esc(c.title || c.name || 'Untitled Course')}</h1>
      <div class="hero-meta">${metaHtml}</div>
      ${desc ? '<p class="hero-desc">' + esc(desc) + '</p>' : ''}
      ${progressHtml}`;
  }


  async function loadContent(){
    const data = await apiCall(MJ_API + '?course_id=' + courseId + '&action=content' + (folderId ? '&folder_id=' + encodeURIComponent(folderId) : ''));
    if(!data || !data.success){ return; }
    const items = data.data || data.content || data.items || data;
    if(Array.isArray(items)){
      contentData = items;
    } else if(items && typeof items === 'object'){
      contentData = items.content || items.items || items.folders || items.data || [];
      if(!Array.isArray(contentData)) contentData = Object.values(contentData);
    }
    document.getElementById('content-count').textContent = contentData.length;
    document.getElementById('tabs-container').style.display = '';
    renderOverview();
    renderContentList();
    document.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.addEventListener('click', function(){
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(tc=>tc.classList.remove('active'));
        document.getElementById('tab-' + this.dataset.tab).classList.add('active');
      });
    });
    if(folderId){
      const cb = document.querySelector('.tab-btn[data-tab="content"]');
      if(cb) cb.click();
    }
  }

  function renderOverview(){
    const c = courseData;
    let totalVids = 0, totalTests = 0, totalFolders = 0, totalPDFs = 0;
    contentData.forEach(item=>{
      if(item.type==='folder'){
        totalFolders++;
        const counts = (item.data && item.data.content_counts) || {};
        const countOf = key => {
          const value = counts[key];
          if(typeof value === 'number') return value;
          return value ? Number(value.free || 0) + Number(value.paid || 0) : 0;
        };
        totalVids += countOf('video');
        totalTests += countOf('test');
        totalPDFs += countOf('pdf');
      }
      else if(item.type==='test') totalTests++;
      else if(item.type==='file'){
        if(item.data && item.data.file_type == 1) totalPDFs++;
        else totalVids++;
      }
    });
    document.getElementById('tab-overview').innerHTML = `
      <div class="overview-grid">
        <div class="stat-card"><div class="stat-icon purple">📁</div><div class="stat-value">${totalFolders}</div><div class="stat-label">Folders</div></div>
        <div class="stat-card"><div class="stat-icon teal">▶</div><div class="stat-value">${totalVids}</div><div class="stat-label">Videos</div></div>
        <div class="stat-card"><div class="stat-icon orange">📄</div><div class="stat-value">${totalPDFs}</div><div class="stat-label">PDFs</div></div>
        <div class="stat-card"><div class="stat-icon green">📝</div><div class="stat-value">${totalTests}</div><div class="stat-label">Tests</div></div>
      </div>
      ${c.description || c.about ? '<div class="section-title">About This Course</div><div style="color:var(--text-dim);font-size:14px;line-height:1.8;margin-bottom:32px">' + (c.description || c.about) + '</div>' : ''}`;
  }

  function renderContentList(parentId){
    const container = document.getElementById('tab-content');
    let items = contentData;
    if(parentId){
      items = contentData.filter(i=>i.parent_id == parentId || i.parent === parentId);
    }
    if(!items.length){
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>No content available yet.</p></div>';
      return;
    }
    let html = '';
    if(folderId){
      html += `<div class="breadcrumb">
        <a href="course.html?course_id=${courseId}">Course</a>
        <span class="sep">›</span>
        <span>${esc(folderTitle || 'Folder')}</span>
      </div>`;
    }
    html += '<div class="content-list">';
    items.forEach((item, idx)=>{
      const title = item.title || item.name || 'Untitled';
      let subText = '';
      let actionHtml = '';
      let itemClass = '';

      if(item.type === 'folder'){
        const cc = (item.data && item.data.content_counts) || {};
        const tot = ['pdf','test','video'].reduce((s,k)=> s + ((cc[k]&&((cc[k].free||0)+(cc[k].paid||0)))||0), 0) + ((cc.folders && cc.folders.total) || 0);
        subText = 'Folder · ' + (item.item_count || item.count || tot || 0) + ' items';
        actionHtml = '<span class="arrow">→</span>';
      } else if(item.type === 'test'){
        if(item.data && item.data.is_submitted) subText = '✓ Submitted';
        else if(item.data && item.data.schedule_start_time) subText = 'Scheduled: ' + item.data.schedule_start_time;
        else subText = 'Test';
        actionHtml = '<span class="btn btn-outline" style="padding:6px 14px;font-size:11px">Start Test</span>';
      } else if(item.type === 'file'){
        const fd = item.data || {};
        if(fd.file_type == 1){
          subText = 'PDF' + (fd.duration ? ' · ' + formatDuration(fd.duration) : '');
          actionHtml = '<span class="arrow">→</span>';
        } else {
          subText = 'Video' + (fd.duration ? ' · ' + formatDuration(fd.duration) : '');
          actionHtml = '<span class="arrow">→</span>';
        }
      }

      html += `<div class="content-item ${itemClass}" onclick="handleContentClick(${idx}, '${item.type}', '${esc(item.entity_id || item.id || '')}')" data-idx="${idx}">
        ${getContentIcon(item)}
        <div class="content-info">
          <div class="content-title">${esc(title)}</div>
          <div class="content-sub">${subText}</div>
        </div>
        ${actionHtml}
      </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
  }

  window.handleContentClick = async function(idx, type, entityId){
    const item = contentData[idx];
    if(!item) return;
    const title = item.title || item.name || '';

    if(type === 'folder'){
      const fid = item.entity_id || item.id;
      window.location.href = 'course.html?course_id=' + courseId + '&folder_id=' + fid + '&folder_title=' + encodeURIComponent(title);
      return;
    }

    if(type === 'test'){
      currentTestId = item.entity_id || item.id;
      currentTestTitle = title;
      await openTest(currentTestId);
      return;
    }

    if(type === 'file'){
      const fd = item.data || {};
      const cid = item.entity_id || item.id;
      showToast('Loading content...');
      setProgress(20);
      const detail = await apiCall(MJ_API + '?course_id=' + courseId + '&action=content_details&content_id=' + cid);
      setProgress(100);
      setTimeout(()=> setProgress(0), 300);

      const dData = detail ? (detail.data && (detail.data.url || detail.data.type) ? detail.data : detail) : null;
      if(dData && (dData.url || dData.download_url || dData.download_urls)){
        const url = dData.url || dData.download_url || (dData.download_urls && dData.download_urls[0]) || '';
        const isPdf = dData.type === 'pdf' || /\.pdf($|\?)/i.test(url) || (fd.file_type == 1 && dData.type !== 'video');
        if(isPdf){
          window.open(url, '_blank');
        } else if(url){
          window.location.href = 'player.html?url=' + encodeURIComponent(url) + '&title=' + encodeURIComponent(title) + '&course=' + encodeURIComponent(window.location.pathname + window.location.search);
        } else {
          showToast('Could not load video URL', 'error');
        }
      } else {
        showToast('Failed to load content details', 'error');
      }
      return;
    }
  };

  // ============ TEST ============
  async function openTest(testId){
    document.getElementById('test-overlay').classList.add('active');
    document.getElementById('test-title').textContent = currentTestTitle;
    document.getElementById('test-question-area').innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-text">Loading test...</div></div>';

    const instrData = await apiCall(MJ_API + '?course_id=' + courseId + '&action=get_test_instructions&test_id=' + testId);

    let instructions = '';
    let duration = 60;
    let totalQ = 0;

    if(instrData && instrData.success){
      const id = instrData.data || instrData;
      instructions = id.instructions || id.description || '';
      duration = id.duration || id.time_limit || 60;
      totalQ = id.total_questions || id.question_count || 0;
    }

    testDuration = duration * 60;
    testSeconds = testDuration;

    document.getElementById('test-question-area').innerHTML = `
      <div class="test-instructions">
        <h2>📋 Test Instructions</h2>
        ${instructions ? '<div>' + instructions + '</div>' : '<p>Please read the instructions carefully before starting the test.</p>'}
        <div class="inst-meta">
          <div class="inst-meta-item"><span class="inst-meta-label">Duration</span><span class="inst-meta-value">${duration} min</span></div>
          <div class="inst-meta-item"><span class="inst-meta-label">Questions</span><span class="inst-meta-value">${totalQ || '—'}</span></div>
        </div>
        <ul>
          <li>Each question carries equal marks.</li>
          <li>There is no negative marking.</li>
          <li>You can mark questions for review.</li>
          <li>Timer starts once you click "Start Test".</li>
        </ul>
        <button class="btn-start-test" onclick="startTest('${testId}')">Start Test →</button>
      </div>`;
    renderKatex(document.getElementById('test-question-area'));
  }

  window.startTest = async function(testId){
    document.getElementById('test-question-area').innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-text">Loading questions...</div></div>';

    const qData = await apiCall(MJ_API + '?course_id=' + courseId + '&action=get_test_data&test_id=' + testId);
    if(!qData || !qData.success){
      document.getElementById('test-question-area').innerHTML = '<div class="error-state"><div class="error-msg">Failed to load test questions.</div></div>';
      return;
    }

    const qd = qData.data || qData;
    testQuestions = qd.questions || qd.data || qd.items || [];
    if(!Array.isArray(testQuestions)) testQuestions = [];

    currentQ = 0;
    testAnswers = {};
    visitedSet = new Set();
    answeredSet = new Set();
    reviewSet = new Set();
    visitedSet.add(0);

    testTimer = setInterval(()=>{
      testSeconds--;
      document.getElementById('test-timer').textContent = formatTime(Math.max(0, testSeconds));
      if(testSeconds <= 60){
        document.getElementById('test-timer').classList.add('warning');
      }
      if(testSeconds <= 0){
        clearInterval(testTimer);
        submitTest();
      }
    }, 1000);
    document.getElementById('test-timer').textContent = formatTime(testSeconds);

    renderTestNav();
    renderQuestion();
  };

  function renderTestNav(){
    const grid = document.getElementById('test-nav-grid');
    grid.innerHTML = '';
    testQuestions.forEach((q, i)=>{
      const btn = document.createElement('button');
      btn.className = 'test-nav-btn';
      if(i === currentQ) btn.classList.add('current');
      if(answeredSet.has(i)) btn.classList.add('answered');
      if(reviewSet.has(i)) btn.classList.add('review');
      btn.textContent = i + 1;
      btn.onclick = ()=>{ visitedSet.add(i); currentQ = i; renderTestNav(); renderQuestion(); };
      grid.appendChild(btn);
    });
  }

  function renderQuestion(){
    const area = document.getElementById('test-question-area');
    if(!testQuestions.length){ area.innerHTML = '<div class="empty-state">No questions found.</div>'; return; }
    const q = testQuestions[currentQ];
    const qText = q.question || q.text || q.question_text || q.statement || '';
    const options = q.options || q.choices || q.answers || [];
    const selected = testAnswers[currentQ];

    let html = `
      <div class="test-q-header">
        <span class="test-q-number">Question ${currentQ + 1} of ${testQuestions.length}</span>
        <div class="test-q-actions">
          <button class="btn-mark-review ${reviewSet.has(currentQ)?'active':''}" onclick="toggleReview()">
            ${reviewSet.has(currentQ)?'★ Marked':'☆ Mark for Review'}
          </button>
          <button class="btn-clear" onclick="clearAnswer()">Clear</button>
        </div>
      </div>
      <div class="test-question-text">${qText}</div>
      <div class="test-options">`;

    const letters = ['A','B','C','D','E'];
    options.forEach((opt, i)=>{
      const optText = (typeof opt === 'string') ? opt : (opt.text || opt.value || opt.option || '');
      const isSelected = selected === i;
      html += `<div class="test-option ${isSelected?'selected':''}" onclick="selectOption(${i})">
        <div class="option-letter">${letters[i]}</div>
        <div class="option-text">${optText}</div>
      </div>`;
    });

    html += '</div>';
    area.innerHTML = html;

    const prevBtn = document.querySelector('.btn-prev');
    const nextBtn = document.querySelector('.btn-next');
    prevBtn.style.display = currentQ > 0 ? '' : 'none';
    nextBtn.textContent = currentQ < testQuestions.length - 1 ? 'Next →' : 'Finish';

    renderKatex(area);
  }

  window.selectOption = function(optIdx){
    testAnswers[currentQ] = optIdx;
    answeredSet.add(currentQ);
    renderQuestion();
    renderTestNav();
  };

  window.clearAnswer = function(){
    delete testAnswers[currentQ];
    answeredSet.delete(currentQ);
    renderQuestion();
    renderTestNav();
  };

  window.toggleReview = function(){
    if(reviewSet.has(currentQ)) reviewSet.delete(currentQ);
    else reviewSet.add(currentQ);
    renderQuestion();
    renderTestNav();
  };

  window.prevQuestion = function(){
    if(currentQ > 0){ currentQ--; visitedSet.add(currentQ); renderTestNav(); renderQuestion(); }
  };

  window.nextQuestion = function(){
    if(currentQ < testQuestions.length - 1){ currentQ++; visitedSet.add(currentQ); renderTestNav(); renderQuestion(); }
  };

  window.saveAndNext = function(){
    answeredSet.add(currentQ);
    nextQuestion();
  };

  window.closeTest = function(){
    if(confirm('Are you sure you want to exit? Your progress will be lost.')){
      clearInterval(testTimer);
      document.getElementById('test-overlay').classList.remove('active');
      document.getElementById('test-mobile-toggle').style.display = 'none';
    }
  };

  window.toggleTestSidebar = function(){
    document.getElementById('test-sidebar').classList.toggle('mobile-open');
  };

  window.showSubmitModal = function(){
    const answered = answeredSet.size;
    const notAnswered = testQuestions.length - answered;
    const marked = reviewSet.size;
    document.getElementById('submit-stats').innerHTML = `
      <div class="submit-stat"><div class="submit-stat-val green">${answered}</div><div class="submit-stat-lbl">Answered</div></div>
      <div class="submit-stat"><div class="submit-stat-val red">${notAnswered}</div><div class="submit-stat-lbl">Not Answered</div></div>
      <div class="submit-stat"><div class="submit-stat-val orange">${marked}</div><div class="submit-stat-lbl">Marked for Review</div></div>`;
    document.getElementById('submit-modal').classList.add('active');
  };

  window.closeSubmitModal = function(){
    document.getElementById('submit-modal').classList.remove('active');
  };

  window.submitTest = function(){
    clearInterval(testTimer);
    document.getElementById('submit-modal').classList.remove('active');
    document.getElementById('test-overlay').classList.remove('active');
    document.getElementById('test-mobile-toggle').style.display = 'none';
    showToast('Test submitted successfully!');
  };

  function esc(s){
    if(!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  loadCourse();
})();
</script>
